{% extends 'base.html' %}{% block title %}Library{% endblock %}{% block content %}
<h2 style="margin:0">📖 Library</h2><p style="color:#64748b">Books • Borrow • Return</p>
<form method="post" style="background:#fff;padding:18px;border-radius:16px;display:flex;gap:8px;flex-wrap:wrap">{% csrf_token %}<input placeholder="Book Title *" required style="padding:11px;border:1px solid #cbd5e1;border-radius:10px;flex:1"><input placeholder="Author" style="padding:11px;border:1px solid #cbd5e1;border-radius:10px"><input placeholder="Category" style="padding:11px;border:1px solid #cbd5e1;border-radius:10px"><input placeholder="Copies" type="number" value="1" style="padding:11px;border:1px solid #cbd5e1;border-radius:10px;width:100px"><button class="btn">➕ Add Book</button></form>
<table style="width:100%;background:#fff;border-collapse:collapse;margin-top:14px"><tr style="background:#0a2463;color:#fff"><th style="padding:10px;text-align:left">Title</th><th>Author</th><th>Category</th><th>Copies</th><th>Action</th></tr>
{% for b in books %}<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:10px"><b>📖 {{ b.title }}</b></td><td style="text-align:center">{{ b.author }}</td><td style="text-align:center">{{ b.category }}</td><td style="text-align:center">{{ b.copies }}</td><td style="text-align:center"><button class="btn" style="padding:6px 12px">Borrow</button></td></tr>{% empty %}<tr><td colspan="5" style="padding:20px;text-align:center">No books</td></tr>{% endfor %}</table>
{% endblock %}
